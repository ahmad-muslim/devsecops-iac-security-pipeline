name: IaC Security Scan (Checkov)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Static Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'terraform'
          output_format: 'cli'
          soft_fail: false # Set to true if you don't want failed security checks to block the build
